climate:
  - platform: panasonic_ir
    id: panasonic_climate
    name: Panasonic Climate
    transmitter_id: xmitr
    receiver_id: rcvr
    model: DKE
    vertical_vane_default: 4

select:
  - platform: panasonic_ir
    panasonic_ir_id: panasonic_climate
    vane_position:
      name: Panasonic Vane Position
    horizontal_vane_position:
      name: Panasonic Horizontal Vane Position

api:
  actions:
    - action: ac_panasonic_send_command
      variables:
        data: string
      then:
        - lambda: |-
            id(panasonic_climate).send_command_hex(data);
