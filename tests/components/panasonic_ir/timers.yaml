# Experimental: requested HA state, not confirmation from the indoor unit.
# Each operation addresses one slot and preserves the opposite timer type with enable + 0x600.
time:
  - platform: homeassistant
    id: ha_clock
    timezone: Australia/Sydney

panasonic_ir:
  id: ha_timers
  climate_id: panasonic_rkr_climate
  time_id: ha_clock

datetime:
  - platform: panasonic_ir
    id: ac_on1_time
    timers_id: ha_timers
    timer: ON1
    name: "ON1 time"
  - platform: panasonic_ir
    id: ac_off1_time
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 time"
  - platform: panasonic_ir
    id: ac_on2_time
    timers_id: ha_timers
    timer: ON2
    name: "ON2 time"
  - platform: panasonic_ir
    id: ac_off2_time
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 time"

switch:
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON1
    name: "ON1 enabled (requested)"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 enabled (requested)"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON2
    name: "ON2 enabled (requested)"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 enabled (requested)"

button:
  - platform: panasonic_ir
    timers_id: ha_timers
    apply_timers:
      name: "Apply All HA Timers"
    apply_on1:
      name: "Apply ON1"
    apply_on2:
      name: "Apply ON2"
    apply_off1:
      name: "Apply OFF1"
    apply_off2:
      name: "Apply OFF2"

climate:
  - platform: panasonic_ir
    id: panasonic_rkr_climate
    name: RKR Timer Test
    model: RKR
    transmitter_id: xmitr
    receiver_id: rcvr
