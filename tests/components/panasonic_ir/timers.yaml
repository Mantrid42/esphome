# Requested or remotely observed state, not acknowledgement from the indoor unit.
time:
  - platform: homeassistant
    id: ha_clock
    timezone: Australia/Sydney

panasonic_ir:
  id: ha_timers
  climate_id: panasonic_rkr_climate
  accept_received_timers: true
  time_id: ha_clock

datetime:
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON1
    name: "ON1 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON2
    name: "ON2 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 time"

select:
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON1
    name: "ON1 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON2
    name: "ON2 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 mode"

switch:
  - platform: panasonic_ir
    timers_id: ha_timers
    econavi:
      name: ECONAVI

button:
  - platform: panasonic_ir
    timers_id: ha_timers
    apply_on1:
      name: "Apply ON1"
    apply_on2:
      name: "Apply ON2"
    apply_off1:
      name: "Apply OFF1"
    apply_off2:
      name: "Apply OFF2"
    apply_timers:
      name: "Apply All HA Timers"
    cancel_all:
      name: "Cancel All Timers"
    powerful_quiet:
      name: "POWERFUL⁄QUIET"
    nanoe_g:
      name: "NANOE-G"
    iauto_x:
      name: "iAUTO-X"

climate:
  - platform: panasonic_ir
    id: panasonic_rkr_climate
    name: RKR Timer Test
    model: RKR
    transmitter_id: xmitr
    receiver_id: rcvr

api:
  actions:
    - action: ac_panasonic_set
      variables:
        power: {type: string, required: false}
        hvac_mode: {type: string, required: false}
        temperature: {type: int, default: -1}
        fan_mode: {type: string, required: false}
        vertical_vane: {type: string, required: false}
        horizontal_vane: {type: string, required: false}
        swing_mode: {type: string, required: false}
        preset: {type: string, required: false}
        mild_dry: {type: string, required: false}
        iauto_x: {type: string, required: false}
      then:
        - if:
            condition:
              lambda: return id(panasonic_rkr_climate).api_set(power, hvac_mode, temperature, fan_mode, vertical_vane, horizontal_vane, swing_mode, preset, mild_dry, iauto_x);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid or incompatible Panasonic request, or clock unavailable"
    - action: ac_panasonic_timer_set
      variables:
        timer: string
        local_time: {type: string, default: unchanged}
        minutes_from_now: {type: int, default: -1}
        timer_mode: {type: string, default: unchanged}
      then:
        - if:
            condition:
              lambda: return id(ha_timers).api_set(timer, local_time, minutes_from_now, timer_mode);
            then:
              - api.respond:
                  success: true
            else:
              - api.respond:
                  success: false
                  error_message: "Invalid or incompatible Panasonic request, or clock unavailable"
