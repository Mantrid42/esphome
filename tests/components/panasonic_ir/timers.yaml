# Requested or remotely observed state, not acknowledgement from the indoor unit.
time:
  - platform: homeassistant
    id: ha_clock
    timezone: Australia/Sydney

panasonic_ir:
  id: ha_timers
  climate_id: panasonic_rkr_climate
  accept_received_timers: true
  time_id: ha_clock

datetime:
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON1
    name: "ON1 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON2
    name: "ON2 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 time"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 time"

select:
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON1
    name: "ON1 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: ON2
    name: "ON2 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF1
    name: "OFF1 mode"
  - platform: panasonic_ir
    timers_id: ha_timers
    timer: OFF2
    name: "OFF2 mode"

switch:
  - platform: panasonic_ir
    timers_id: ha_timers
    econavi:
      name: ECONAVI

button:
  - platform: panasonic_ir
    timers_id: ha_timers
    apply_on1:
      name: "Apply ON1"
    apply_on2:
      name: "Apply ON2"
    apply_off1:
      name: "Apply OFF1"
    apply_off2:
      name: "Apply OFF2"
    apply_timers:
      name: "Apply All HA Timers"
    cancel_all:
      name: "Cancel All Timers"
    powerful_quiet:
      name: "POWERFUL⁄QUIET"
    nanoe_g:
      name: "NANOE-G"
    iauto_x:
      name: "iAUTO-X"

climate:
  - platform: panasonic_ir
    id: panasonic_rkr_climate
    name: RKR Timer Test
    model: RKR
    transmitter_id: xmitr
    receiver_id: rcvr
